<svg width="100%" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sai Santosh Kumar Devarasetty — hero banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16140F"/>
      <stop offset="100%" stop-color="#262218"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4793F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E4793F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8A165" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#D8A165" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4996A">
        <animate attributeName="offset" values="0;0.15;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D8A165"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <circle cx="1010" cy="80" r="190" fill="url(#glowA)" filter="url(#softBlur)">
    <animate attributeName="cy" values="80;55;80" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="330" r="150" fill="url(#glowB)" filter="url(#softBlur)">
    <animate attributeName="cy" values="330;305;330" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g fill="#D8A165" opacity="0.75">
    <circle cx="120" cy="55" r="2.2"><animate attributeName="cy" values="55;35;55" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="235" r="1.8"><animate attributeName="cy" values="235;215;235" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="330" r="2.4"><animate attributeName="cy" values="330;310;330" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="215" r="1.6"><animate attributeName="cy" values="215;195;215" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="35" r="2"><animate attributeName="cy" values="35;18;35" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="360" r="1.6"><animate attributeName="cy" values="360;345;360" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="40" y="36" width="1120" height="308" rx="26" fill="#1E1B16" fill-opacity="0.55" stroke="#383226" stroke-width="1.2"/>
  <rect x="40" y="36" width="1120" height="308" rx="26" fill="none" stroke="#E4793F" stroke-opacity="0.4" stroke-width="1.1">
    <animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="82" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="600" fill="url(#nameGrad)">Sai Santosh Kumar Devarasetty</text>
  <text x="84" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="17" letter-spacing="2.4" font-weight="700" fill="#E4793F">SAP S/4HANA &amp; BTP CONSULTANT · AI &amp; ML ENGINEER</text>

  <text x="84" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#C8C0AF">Bridging enterprise SAP data and intelligent systems — Clean Core</text>
  <text x="84" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#C8C0AF">S/4HANA solutions, ML pipelines, and automated code-generation agents.</text>

  <g transform="translate(84 272)">
    <rect width="214" height="28" rx="14" fill="#262218" stroke="#383226"/>
    <circle cx="18" cy="14" r="4" fill="#E4793F"/>
    <text x="32" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#C8C0AF">BENTONVILLE, AR · USA</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <g transform="translate(84 336)">
      <text font-size="21" font-weight="800" fill="#E4793F">1B+</text>
      <text y="18" font-size="10" font-weight="700" letter-spacing="1" fill="#938A78">RECORDS PROCESSED</text>
    </g>
    <g transform="translate(300 336)">
      <text font-size="21" font-weight="800" fill="#E4793F">3+</text>
      <text y="18" font-size="10" font-weight="700" letter-spacing="1" fill="#938A78">YEARS EXPERIENCE</text>
    </g>
    <g transform="translate(478 336)">
      <text font-size="21" font-weight="800" fill="#E4793F">3</text>
      <text y="18" font-size="10" font-weight="700" letter-spacing="1" fill="#938A78">FEATURED PROJECTS</text>
    </g>
    <g transform="translate(680 336)">
      <text font-size="21" font-weight="800" fill="#E4793F">6</text>
      <text y="18" font-size="10" font-weight="700" letter-spacing="1" fill="#938A78">CERTIFICATIONS</text>
    </g>
  </g>
</svg>
