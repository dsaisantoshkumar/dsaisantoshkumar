    <!-- title bar -->
    <rect width="900" height="34" fill="#262218"/>
    <circle cx="22" cy="17" r="6" fill="#E4793F"/>
    <circle cx="44" cy="17" r="6" fill="#D8A165"/>
    <circle cx="66" cy="17" r="6" fill="#7FBE7A"/>
    <text x="450" y="21" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="12" fill="#938A78">sai@devbox: ~/portfolio</text>

    <g font-family="'Cascadia Code','Consolas',monospace" font-size="15">
      <text x="24" y="66" fill="#7FBE7A" font-weight="700" opacity="0">$ whoami<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0000;0.0250;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="94" fill="#C8C0AF" font-weight="400" opacity="0">sai_santosh_kumar_devarasetty<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1667;0.1917;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="122" fill="#7FBE7A" font-weight="700" opacity="0">$ cat focus.txt<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.3583;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="150" fill="#C8C0AF" font-weight="400" opacity="0">Backend systems in Python/Java + SAP ABAP, shipped and supported in prod.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5250;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="178" fill="#7FBE7A" font-weight="700" opacity="0">$ python run_tests.py --suite api<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6667;0.6917;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="24" y="206" fill="#C8C0AF" font-weight="400" opacity="0">[INFO] Postman + unit/API tests — all endpoints validated ✓<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8333;0.8583;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <rect x="24" y="220" width="9" height="16" fill="#E4793F"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- glow sweep -->
    <rect x="-300" y="34" width="300" height="226" fill="#E4793F" opacity="0.05">
      <animate attributeName="x" values="-300;900" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="16" fill="none" stroke="#383226" stroke-width="1.2"/>
</svg>
